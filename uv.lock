[project]
name = "worldcup-rag-chatbot"
version = "0.1.0"
description = "Bilingual (Arabic/English) Agentic RAG chatbot for the FIFA World Cup 2026."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MDK" }]
dependencies = [
    "llama-index>=0.12.0",
    "llama-index-embeddings-huggingface",
    "llama-index-vector-stores-chroma",
    "llama-index-llms-huggingface",
    "llama-index-postprocessor-flag-embedding-reranker",
    "chromadb>=0.5.0",
    "transformers>=4.45.0",
    "peft>=0.13.0",
    "bitsandbytes>=0.44.0",
    "accelerate>=1.0.0",
    "trl>=0.12.0",
    "datasets>=3.0.0",
    "sentence-transformers>=3.0.0",
    "matplotlib>=3.9.0",
    "sqlalchemy>=2.0.0",
    "pandas>=2.2.0",
    "beautifulsoup4>=4.12.0",
    "wikipedia-api>=0.7.0",
    "lingua-language-detector>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "ragas>=0.2.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.40.0",
    "torch>=2.4.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "black>=24.0.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "data", "models", "chroma_db"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]  # handled by black

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
exclude = ["notebooks/", "data/", "models/", "chroma_db/"]

[[tool.mypy.overrides]]
module = [
    "lingua.*",
    "ragas.*",
    "chromadb.*",
    "bitsandbytes.*",
    "trl.*",
    "peft.*",
    "datasets.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
